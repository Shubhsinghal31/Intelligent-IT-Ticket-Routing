name: CI

# Runs on every push and every PR targeting main. PRs are the point where
# this matters most — it's the automated check a reviewer leans on instead
# of manually running lint/tests locally before approving.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =====================================================
  # Lint — ruff (style/correctness) + black (formatting)
  # =====================================================
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

  # =====================================================
  # Tests — unit (mocked) + integration (real Postgres)
  # =====================================================
  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest

    # backend/core/config.py's Settings() has three required fields with no
    # defaults (DB_PASSWORD, DATABASE_URL, JWT_SECRET_KEY) — deliberately,
    # so the app can never silently boot with a placeholder secret. Locally
    # these come from a gitignored .env file that doesn't exist on this
    # runner. Even the UNIT suite needs them set: it imports backend.models,
    # which imports the whole chain down to config.py at module load time,
    # before a single test actually runs or a single mock gets used.
    # tests/integration/conftest.py sets the DB_* vars itself (matching the
    # postgres service below) but not JWT_SECRET_KEY, so this job-level env
    # block is what both the unit and integration steps rely on.
    env:
      DATABASE_URL: postgresql://postgres:test_password@localhost:5433/helpdesk_ai_test
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_NAME: helpdesk_ai_test
      DB_USER: postgres
      DB_PASSWORD: test_password
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-32chars-min

    # A real Postgres for the integration suite. Configured identically to
    # docker/docker-compose.test.yml (same image, user, password, db name,
    # host port 5433) so tests/integration/conftest.py's default
    # TEST_DATABASE_URL works here with no extra env vars — whether you
    # run the suite locally via that compose file or here in CI, it's
    # pointed at the same shape of database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: helpdesk_ai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v

      - name: Run integration tests
        run: pytest tests/integration -v
